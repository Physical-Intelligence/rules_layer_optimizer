name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # SLSA verification requires a semantic version reference for the shared builder.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.6.0
    with:
      tag_name: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref_name, '-') }}
      release_files: |
        dist/rules_layer_optimizer-*.tar.gz
        dist/source.json
        dist/installation.MODULE.bazel

  publish:
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

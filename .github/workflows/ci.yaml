name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit==4.2.0
      - run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', examples, e2e/smoke, e2e/rules_python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.module }}
          repository-cache: true
      - run: bazel test //...
        working-directory: ${{ matrix.module }}
      - if: matrix.module == 'examples'
        run: >-
          bazel test //python_image:layers_test
          //shared_dependencies:sharing_test //shared_dependencies:wheel_contents_test
          //:python_image_backend_test //:rules_python_image_backend_test
          //rules_python_image:sharing_test //rules_python_image:source_contents_test
          //rules_python_image:wheel_contents_test
        working-directory: examples
      - if: matrix.module == 'examples'
        name: Run both Python adapters with both image backends
        working-directory: examples
        run: |
          bazel run //python_image:load
          docker run --rm --network none rules-layer-optimizer-example:local | grep -F 'hello from reusable layers'
          bazel run //python_image:img_load
          docker run --rm --network none rules-layer-optimizer-aspect-img:local | grep -F 'hello from reusable layers'
          bazel run //rules_python_image:load
          docker run --rm --network none rules-layer-optimizer-rules-python:local | grep -F 'hello from reusable layers'
          bazel run //rules_python_image:img_load
          docker run --rm --network none rules-layer-optimizer-rules-python-img:local | grep -F 'hello from reusable layers'
